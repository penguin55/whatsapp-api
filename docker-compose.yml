services:
  api:
    image: ${WA_GATEWAY_IMAGE:-ariutomo/wa_gateway_api:2.0}
    container_name: wa_gateway_api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-3000}:3000"
    networks:
      - gateway
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  gateway:
    name: volka_gateway_network
    external: true
